name: CI
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-websockets-dev qt6-svg-dev libqt6svg6 \
            libssl-dev libcrypto++-dev libsodium-dev libsecp256k1-dev libqrencode-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
  windows:
    runs-on: windows-latest
    continue-on-error: true # Windows port is experimental
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-websockets mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-openssl mingw-w64-x86_64-crypto++
            mingw-w64-x86_64-libsodium             mingw-w64-x86_64-qrencode
      - name: Build secp256k1 (not packaged in MSYS2)
        run: |
          git clone --depth 1 --branch v0.5.1 https://github.com/bitcoin-core/secp256k1.git /tmp/secp
          cmake -S /tmp/secp -B /tmp/secp/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/mingw64 -DBUILD_SHARED_LIBS=OFF \
            -DSECP256K1_BUILD_TESTS=OFF -DSECP256K1_BUILD_EXHAUSTIVE_TESTS=OFF \
            -DSECP256K1_ENABLE_MODULE_RECOVERY=ON -DSECP256K1_BUILD_BENCHMARK=OFF -DSECP256K1_BUILD_EXAMPLES=OFF
          cmake --build /tmp/secp/build
          cmake --install /tmp/secp/build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build
